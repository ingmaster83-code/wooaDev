<script>
function encode() {
  const t = document.getElementById('inputText').value;
  setOutput(encodeURIComponent(t));
  parseQuery(t);
}
function decode() {
  const t = document.getElementById('inputText').value;
  try { setOutput(decodeURIComponent(t)); parseQuery(decodeURIComponent(t)); }
  catch(e) { setOutput(unescape(t)); }
}
function autoConvert() {
  const t = document.getElementById('inputText').value;
  parseQuery(t);
}
function clearAll() { document.getElementById('inputText').value=''; setOutput(''); document.getElementById('queryPanel').style.display='none'; }
function setOutput(v) { document.getElementById('outputText').textContent = v; }
function copyOutput() {
  const text = document.getElementById('outputText').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent='복사', 1500);
  });
}
function parseQuery(url) {
  try {
    const qs = url.includes('?') ? url.split('?')[1] : url;
    const params = new URLSearchParams(qs);
    const entries = [...params.entries()];
    if (!entries.length) { document.getElementById('queryPanel').style.display='none'; return; }
    document.getElementById('queryBody').innerHTML = entries.map(([k,v]) =>
      `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
    document.getElementById('queryPanel').style.display='block';
  } catch(e) { document.getElementById('queryPanel').style.display='none'; }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
